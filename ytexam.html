<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing:border-box;
        }
        body{
            margin:0px;
            padding:0px;
            background-color:white;
            color:black;
        }
        .navbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:10px 30px;
            top:0px;
            width:100%;
            position:fixed;
            z-index:10;
            background-color:white;
            border:solid 2px black;
        }
        .logo{
            font-size:large;
            font-weight:bold;
            color:red;
        }
        .search{
            flex:1;
            display:flex;
            justify-content:center;
        }
        .search input{
            width:50%;
            padding:10px;
            border-radius:5px;
            border:1px solid grey;
        }
        .profile{
            width:60px;
            height:60px;
            background-color:yellow;
            border-radius: 50%;
            border: solid 2px black;
            overflow:hidden;
        }
        .layout{
            display:flex;
        }
        .sidebar{
            display:flex;
            position:fixed;
            flex-direction:column;
            justify-content:space-between;
            background-color:white;
            color:black;
            padding:20px 30px;
            min-height:100vh;
            top:80px;
            width:200px;
            border:solid 2px black;
        }
        .main{
            display:grid;
            grid-template-columns:repeat(4,minmax(300px,1fr));
            gap:20px;
            top:80px;
            position:relative;
            margin-left:200px;
            padding:20px 30px;
        }
        .video{
            display:flex;
            flex-direction:column;
            gap:10px;
        }
        .video .img{
            width:100%;
            height:150px;
            background-color:grey;
        }
        .video .title{
            font-weight:bold;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">MyTube</div>
        <div class="search">
            <input type="text" placeholder="Search...">
            </div>
        <div class="profile"></div>    
    </div>
    <div class="layout"> 
    <div class="sidebar">
        <span class="side">HOME</span>
        <span class="side">TRENDING</span>
        <span class="side">SUBSCRIPTIONS</span>
        <span class="side">LIBRARY</span>
        <span class="side">HISTORY</span>
        <span class="side">SETTINGS</span>
    </div>
    <div class="main">
        <div class="video video1">
            <div class="img one"></div>
            <div class="title">Video Title 1</div>
        </div>
        <div class="video video2">
            <div class="img two"></div>
            <div class="title">Video Title 2</div>
        </div>
        <div class="video video3">
            <div class="img three"></div>
            <div class="title">Video Title 3</div>
        </div>
        <div class="video video4">
            <div class="img four"></div>
            <div class="title">Video Title 4</div>
        </div>
        <div class="video video5">
            <div class="img five"></div>
            <div class="title">Video Title 5</div>
        </div>
        <div class="video video6">
            <div class="img six"></div>
            <div class="title">Video Title 6</div>
        </div>
    </div>
    </div>
</body>
</html>
