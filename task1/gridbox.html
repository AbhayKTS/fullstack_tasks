<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Box Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .grid-container {
            height: 100vh;
        }

        .grid-box {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            font-weight: 900;
            height: 150px;
            width: 150px;
        }

        #box1{
            position: fixed;
            top: 300px;
            left: 700px;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-box" id="box1" style="background-color: #f0c60a;">Box 1</div>
        <div class="grid-box" style="background-color: #f00505;">Box 2</div>
        <div class="grid-box" style="background-color: #00e1ff;">Box 3</div>
        <div class="grid-box" style="background-color: #4CAF50;">Box 4</div>
        <div class="grid-box" style="background-color: #001b01;">Box 5</div>
        <div class="grid-box" style="background-color: #0011ff;">Box 6</div>
        <div class="grid-box" style="background-color: #7a06b4;">Box 7</div>
        <div class="grid-box" style="background-color: #740355;">Box 8</div>
        <div class="grid-box" style="background-color: #6c022d;">Box 9</div>
    </div>
</body>
</html>
