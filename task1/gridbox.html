<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Box Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #2e023a;
        }
        /*.grid-container {
            height: 100vh;
        }
*/
        .grid-box {
            width: 100%;
            height: 990px;
            position: relative;
            overflow: hidden;
            text-align: center;
            text-transform: uppercase;
            color: white;
            font-weight: 900;
        }

        .grid-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            pointer-events: none;
        }


    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-box" id="box1">
            <video autoplay muted loop playsinline>
                    <source src="assets\Firefly in this video use the frame i gave and just let the person unsheath the sword 14101.mp4" type="video/mp4">
            </video>
            <div class="overlay-text">Northern Blade</div>
        </div>
        <div class="grid-box" id="box2" style="background-color: #f00505;">Box 2</div>
        <div class="grid-box" style="background-color: #00e1ff;">Box 3</div>
        <div class="grid-box" style="background-color: #4CAF50;">Box 4</div>
        <div class="grid-box" style="background-color: #001b01;">Box 5</div>
        <div class="grid-box" style="background-color: #0011ff;">Box 6</div>
        <div class="grid-box" style="background-color: #7a06b4;">Box 7</div>
        <div class="grid-box" style="background-color: #740355;">Box 8</div>
        <div class="grid-box" style="background-color: #6c022d;">Box 9</div>
    </div>
</body>
</html>
