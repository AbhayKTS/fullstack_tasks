<!DOCTYPE html>
<html lang="en">

<head>
    <title>Naruto Characters</title>

    <style>

        body {
            background-color: #111;
            margin: 0;
        }

        .box {
            width: 700px;
            height: 500px;
            margin: 80px auto;

            position: sticky;
            top: 10%;

            background-size: cover;
            background-position: center;

            border: 8px solid;
            border-image: linear-gradient(
                45deg,
                black,
                white,
                silver,
                gold
            ) 1;
        }

        .box h1 {
            color: white;
            text-align: center;
            font-size: 70px;
            padding-top: 30px;

            text-shadow: 5px 5px 10px black;
        }

        .box1 {
            background-image: url("https://cdn.wallpapersafari.com/84/67/c4pd76U.jpg");
        }

        .box2 {
            background-image: url("https://www.coolkatana.com/cdn/shop/articles/Sasuke_Uchiha_Sword_of_Kusanagi_Lightning_Blade_Collector_s_Guide_00caf689-4336-4924-b99a-2931cc6eaa5e.jpg?v=1785199523");
        }

        .box3 {
            background-image: url("https://images.wallpapersden.com/image/download/itachi-uchiha-hd-naruto-art_bWVta2qUmZqaraWkpJRmZW1lrWZuZ2U.jpg");
        }

        .box4 {
            background-image: url("https://i.pinimg.com/originals/d3/87/c1/d387c198f2a5f81c31af513c4be8b45a.jpg");
        }

        .box5 {
            background-image: url("https://www.baltana.com/files/wallpapers-31/Anime-Kakashi-High-Definition-Wallpaper-105645.jpg");
        }

        .box6 {
            background-image: url("https://w0.peakpx.com/wallpaper/985/461/HD-wallpaper-minato-namikaze-anime-hokage-manga-naruto-shippuden-ninja-yondaime.jpg");
        }

        .box7 {
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWfbECHJKzhV2y3Wod2rwOVnsWLKNwioX811UBEEAa4A&s");
        }

        .box8 {
            background-image: url("https://wallpapers.com/images/hd/nagatocomo-pain-de-naruto-shippuden-mdu7f1b4d8jf5awy.jpg");
        }

        .box9 {
            background: radial-gradient(
                circle,
                orange,
                red,
                purple,
                black
            );
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box box1">
            <h1>NARUTO</h1>
        </div>

        <div class="box box2">
            <h1>SASUKE</h1>
        </div>

        <div class="box box3">
            <h1>ITACHI</h1>
        </div>

        <div class="box box4">
            <h1>MADARA</h1>
        </div>

        <div class="box box5">
            <h1>KAKASHI</h1>
        </div>

        <div class="box box6">
            <h1>MINATO</h1>
        </div>

        <div class="box box7">
            <h1>OBITO</h1>
        </div>

        <div class="box box8">
            <h1>PAIN</h1>
        </div>

        <div class="box box9">
            <h1>CHAKRA</h1>
        </div>

    </div>

</body>

</html>
