<!DOCTYPE html>
<html>
<head>
    <title>Conic Gradient</title>

    <style>
        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            height: 100vh;
        }

        /* Square */
        .box9 {
            width: 200px;
            height: 200px;
            padding: 6px;
            border-radius: 20px;

            background: conic-gradient(
                red,
                yellow,
                lime,
                cyan,
                blue,
                magenta,
                red
            );
        }

        /* Circle */
        .box2 {
            width: 200px;
            height: 200px;
            padding: 6px;
            border-radius: 50%;

            background: conic-gradient(
                from 45deg,
                red,
                yellow,
                lime,
                cyan,
                blue,
                magenta,
                red
            );
        }

        .inside {
            width: 100%;
            height: 100%;
            background-color: #222;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 20px;
        }

        .box9 .inside {
            border-radius: 14px;
        }
    </style>
</head>

<body>

    <div class="box9">
        <div class="inside">
            Square
        </div>
    </div>

    <div class="box2">
        <div class="inside">
            Circle
        </div>
    </div>

</body>
</html>
