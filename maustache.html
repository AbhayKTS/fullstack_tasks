<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Face — Pure Pseudo-elements</title>
<style>
  :root {
    --skin: #e8b98a;
    --skin-shadow: #d6a374;
    --hair: #2b1b12;
    --stache: #241812;
    --bg1: #ffe1b3;
    --bg2: #ffb385;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2));
    font-family: 'Segoe UI', sans-serif;
  }

  .stage {
    position: relative;
    width: 300px;
    height: 340px;
  }

  /* ---------- EARS (behind face) ---------- */
  .face::before, .face::after {
    content: "";
    position: absolute;
    top: 95px;
    width: 24px;
    height: 34px;
    background: var(--skin);
    border-radius: 50%;
    z-index: 0;
  }
  .face::before { left: -12px; }
  .face::after  { right: -12px; }

  /* ---------- FACE ---------- */
  .face {
    position: absolute;
    top: 60px;
    left: 50px;
    width: 200px;
    height: 220px;
    background: var(--skin);
    border-radius: 48% 48% 42% 42% / 55% 55% 45% 45%;
    z-index: 1;
  }

  /* cheek shading, layered separately so it never sits on top of features */
  .face-shade {
    position: absolute;
    top: 60px;
    left: 50px;
    width: 200px;
    height: 220px;
    border-radius: 48% 48% 42% 42% / 55% 55% 45% 45%;
    box-shadow: inset 0 -25px 25px -15px var(--skin-shadow);
    z-index: 2;
    pointer-events: none;
  }

  /* ---------- HAIR (top only, sits above forehead) ---------- */
  .hair {
    position: absolute;
    top: 38px;
    left: 42px;
    width: 216px;
    height: 90px;
    z-index: 3;
  }
  .hair::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: var(--hair);
    border-radius: 50% 50% 30% 30% / 100% 100% 15% 15%;
  }
  /* sideburns, tucked tight to the face edge */
  .hair::after {
    content: "";
    position: absolute;
    top: 45px;
    left: 4px;
    width: 208px;
    height: 40px;
    background: transparent;
    border-left: 12px solid var(--hair);
    border-right: 12px solid var(--hair);
    border-radius: 0 0 40% 40%;
  }

  /* ---------- EYEBROWS ---------- */
  .brow {
    position: absolute;
    top: 128px;
    width: 36px;
    height: 6px;
    background: var(--hair);
    border-radius: 10px;
    z-index: 4;
  }
  .brow.left  { left: 78px; transform: rotate(-4deg); }
  .brow.right { right: 78px; transform: rotate(4deg); }

  /* ---------- EYES ---------- */
  .eye {
    position: absolute;
    top: 142px;
    width: 30px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(0,0,0,.15) inset;
    z-index: 4;
  }
  .eye.left  { left: 82px; }
  .eye.right { right: 82px; }

  .eye::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    background: #4a2f1c;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .eye::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: #000;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 1.5px -1.5px 0 1px rgba(255,255,255,.9);
  }

  /* ---------- NOSE ---------- */
  .nose {
    position: absolute;
    top: 155px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 24px;
    background: var(--skin-shadow);
    border-radius: 0 0 50% 50% / 0 0 60% 60%;
    opacity: .55;
    z-index: 3;
  }

  /* ---------- MUSTACHE ---------- */
  .mustache {
    position: absolute;
    top: 192px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 32px;
    z-index: 5;
  }
  .mustache::before,
  .mustache::after {
    content: "";
    position: absolute;
    top: 0;
    width: 58px;
    height: 32px;
    background: var(--stache);
    border-radius: 100% 20% 60% 0% / 100% 30% 100% 0%;
  }
  .mustache::before {
    left: 0;
    transform: scaleX(-1);
  }
  .mustache::after {
    right: 0;
  }

  /* ---------- MOUTH ---------- */
  .mouth {
    position: absolute;
    top: 214px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 5px;
    background: #7a3b3b;
    border-radius: 0 0 8px 8px;
    z-index: 3;
  }

  /* ---------- BEARD (jawline + chin only, mouth stays clear) ---------- */
  .beard {
    position: absolute;
    top: 205px;
    left: 60px;
    width: 180px;
    height: 75px;
    background: var(--hair);
    z-index: 4;
    clip-path: polygon(
      0% 0%, 100% 0%,
      95% 40%, 80% 75%, 50% 100%, 20% 75%, 5% 40%
    );
  }
  /* carve the mouth/mustache area out of the beard so it doesn't get buried */
  .beard::before {
    content: "";
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 96px;
    height: 34px;
    background: var(--skin);
    border-radius: 50%;
  }

  .label {
    position: absolute;
    bottom: -34px;
    width: 100%;
    text-align: center;
    color: #4a2f1c;
    font-size: 14px;
    letter-spacing: .5px;
    opacity: .7;
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="face"></div>
    <div class="face-shade"></div>
    <div class="hair"></div>
    <div class="brow left"></div>
    <div class="brow right"></div>
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="nose"></div>
    <div class="beard"></div>
    <div class="mustache"></div>
    <div class="mouth"></div>
    <div class="label">built entirely with CSS pseudo-elements</div>
  </div>

</body>
</html>
