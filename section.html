<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section h2{
            color: yellow;
            text-shadow: 1px 1px 0 black;
        }
        section>h2{
            text-transform: lowercase;
        }
        h2+p{
            color: blue;
        }
        h2~p{
            text-transform: uppercase;
        }
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <section>
        <h2>Heading</h2>
        <p>para 1</p>
        <p>para 2</p>
        <div>
            <h2>heading 2</h2>
        </div>
    </section>
    
</body>
</html>
